name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
            use_cross: false
          # x86_64-apple-darwin temporarily removed — GitHub's macos-13
          # runners aren't reliably building this target. Re-add when the
          # runner availability stabilises (Intel Mac users can use the
          # linux-x86_64 binary via Rosetta in the meantime).
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            use_cross: true
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            use_cross: false
            apt: musl-tools
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            use_cross: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - name: Install apt packages
        if: matrix.apt
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --workspace --target ${{ matrix.target }}
          else
            cargo build --release --workspace --target ${{ matrix.target }}
          fi

      - name: Package tarball
        id: pkg
        shell: bash
        run: |
          name="skills-and-validation-${{ steps.ver.outputs.version }}-${{ matrix.target }}"
          mkdir -p "$name/bin" "$name/content" "$name/templates"
          cp "target/${{ matrix.target }}/release/iii-skill-check" "$name/bin/"
          cp "target/${{ matrix.target }}/release/iii-skill-render" "$name/bin/"
          cp -r content/. "$name/content/"
          cp -r templates/. "$name/templates/"
          echo "${{ steps.ver.outputs.version }}" > "$name/VERSION"
          tar -czf "$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
          cat "$name.tar.gz.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: |
            ${{ steps.pkg.outputs.name }}.tar.gz
            ${{ steps.pkg.outputs.name }}.tar.gz.sha256
          retention-days: 7
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve tag
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$tag" \
              --generate-notes
          fi
          for f in dist/*.tar.gz dist/*.tar.gz.sha256; do
            [ -f "$f" ] || continue
            gh release upload "$tag" "$f" --repo "$GITHUB_REPOSITORY" --clobber
          done

      # Re-point the floating major.minor tag (e.g. v0.1) at this commit so
      # consumers can `uses: iii-hq/skills-and-validation@v0.1` and pick up
      # every patch on the line without editing their workflow file.
      - name: Force-update floating major.minor tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag '$tag' is not vMAJOR.MINOR.PATCH; skipping floating tag"
            exit 0
          fi
          minor=$(echo "$tag" | sed -E 's/^(v[0-9]+\.[0-9]+)\.[0-9]+$/\1/')
          sha="${{ github.sha }}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${minor}" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${minor}" \
              -f sha="$sha" -F force=true
            echo "updated floating tag ${minor} -> $sha"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${minor}" -f sha="$sha"
            echo "created floating tag ${minor} -> $sha"
          fi

[package]
name = "iii-skill-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "iii_skill_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
walkdir = "2"
glob = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"
similar-asserts = "1"

name: skills-and-validation
description: Validate worker README/skill artifacts via iii-skill-check
author: iii-hq

inputs:
  version:
    description: |
      Pinned validator version (without the "v" prefix, e.g. 0.1.0).
      Defaults to the version field in the consumer's .skill-check.yaml.
    required: false
  workers-glob:
    description: Glob of worker manifests to verify (relative to GITHUB_WORKSPACE)
    default: "*/iii.worker.yaml"
  layers:
    description: Comma-separated subset of layers to run (structure,vale,ai)
    default: "structure,vale,ai"
  vale-version:
    description: Pinned Vale version
    default: "3.14.1"
  anthropic-api-key:
    description: Anthropic API key for the AI layer (omit to skip AI)
    required: false

runs:
  using: composite
  steps:
    - name: Resolve version
      id: ver
      shell: bash
      run: |
        v="${{ inputs.version }}"
        if [ -z "$v" ]; then
          if [ ! -f .skill-check.yaml ]; then
            echo "ERROR: 'version' input not given and .skill-check.yaml not found at workspace root" >&2
            exit 1
          fi
          v="$(awk '/^version:/{print $2; exit}' .skill-check.yaml)"
        fi
        if [ -z "$v" ]; then
          echo "ERROR: could not resolve a version" >&2
          exit 1
        fi
        echo "version=$v" >> "$GITHUB_OUTPUT"

    - name: Download iii-skill-check release
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        "${{ github.action_path }}/scripts/download.sh" \
          "${{ steps.ver.outputs.version }}" \
          "${{ github.workspace }}/.skill-check"

    - name: Install Vale
      shell: bash
      run: |
        v="${{ inputs.vale-version }}"
        case "$(uname -s)-$(uname -m)" in
          Linux-x86_64)              asset="vale_${v}_Linux_64-bit.tar.gz" ;;
          Linux-arm64|Linux-aarch64) asset="vale_${v}_Linux_arm64.tar.gz" ;;
          Darwin-arm64)              asset="vale_${v}_macOS_arm64.tar.gz" ;;
          Darwin-x86_64)             asset="vale_${v}_macOS_64-bit.tar.gz" ;;
          *) echo "unsupported runner: $(uname -s)-$(uname -m)" >&2; exit 1 ;;
        esac
        curl -sL "https://github.com/errata-ai/vale/releases/download/v${v}/${asset}" \
          | sudo tar -xz -C /usr/local/bin vale
        vale --version

    - name: Verify workers
      id: verify
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        INSTALL_DIR: ${{ github.workspace }}/.skill-check
      run: |
        set -o pipefail
        log="${RUNNER_TEMP:-/tmp}/skv-verify.log"
        body="${RUNNER_TEMP:-/tmp}/skv-summary.md"
        rc=0
        "${{ github.action_path }}/scripts/verify.sh" \
          "${{ inputs.workers-glob }}" \
          "${{ inputs.layers }}" 2>&1 | tee "$log" || rc=$?

        # Inline annotations on the PR's "Files changed" tab. Free; no
        # consumer permission required.
        "${{ github.action_path }}/scripts/annotate.sh" "$log" || true

        # Render the markdown report once; reuse it for both the run-summary
        # surface and the optional sticky PR-comment so both say the same
        # thing (same closer line, same per-layer table).
        "${{ github.action_path }}/scripts/summary.sh" "$log" > "$body"
        cat "$body" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

        # Hand both paths to the optional PR-comment step.
        echo "log=$log" >> "$GITHUB_OUTPUT"
        echo "summary=$body" >> "$GITHUB_OUTPUT"
        exit $rc

    # Sticky PR comment with the same markdown report. Requires the
    # consumer to grant `pull-requests: write` in their workflow's
    # `permissions:` block; without it, this step no-ops via
    # continue-on-error so it never causes a red CI run on its own.
    - name: Post sticky PR comment (opt-in via pull-requests:write)
      if: ${{ always() && github.event_name == 'pull_request' && steps.verify.outputs.summary != '' }}
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        "${{ github.action_path }}/scripts/pr-comment.sh" \
          "${{ github.event.pull_request.number }}" \
          "${{ steps.verify.outputs.summary }}"

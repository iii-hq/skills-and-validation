name: skills-and-validation
description: Validate worker README/skill artifacts via iii-skill-check
author: iii-hq

inputs:
  version:
    description: |
      Pinned validator release to download (e.g. "0.1.5", "0.1", or
      "latest"). Defaults to "latest" — track the most recent stable
      release. Pin via this input or via the `uses:`-line ref
      (`@v0.1.5`) when you want reproducibility.
    required: false
    default: "latest"
  workers-glob:
    description: Glob of worker manifests to verify (relative to GITHUB_WORKSPACE)
    default: "*/iii.worker.yaml"
  layers:
    description: Comma-separated subset of layers to run (structure,vale,ai)
    default: "structure,vale,ai"
  vale-version:
    description: Pinned Vale version
    default: "3.14.1"
  anthropic-api-key:
    description: Anthropic API key for the AI layer (omit to skip AI)
    required: false
  write:
    description: |
      Auto-render workers and commit the rendered diff back to the PR
      branch when the source partials drift from their rendered output.
      Requires the consumer's workflow to grant `contents: write`.
      Defaults to false (read-only validation).
    default: "false"

runs:
  using: composite
  steps:
    - name: Resolve version
      id: ver
      shell: bash
      run: |
        # Release pin lives in the workflow's `uses:` ref (e.g. @v0.1) or in
        # the action's `version` input. The schema-version field inside
        # .skill-check.yaml is unrelated and not consulted here.
        v="${{ inputs.version }}"
        [ -z "$v" ] && v="latest"
        echo "version=$v" >> "$GITHUB_OUTPUT"

    - name: Download iii-skill-check release
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        "${{ github.action_path }}/scripts/ci-install.sh" \
          "${{ steps.ver.outputs.version }}" \
          "${{ github.workspace }}/.skill-check"

    # Render every matching worker into the CI workspace so the verify step
    # below always operates on fresh artifacts. Without this, an out-of-sync
    # README/skill could mask voice or structure violations that exist in
    # docs/ but haven't been re-rendered yet. No commit happens here — the
    # commit-and-push step (write mode only) runs *after* verify passes,
    # which guarantees the bot never pushes content the action hasn't
    # validated.
    #
    # Failures (e.g. missing docs/intro.md) are translated into a
    # violations-format line and written to a preflight log so the verify
    # step can prepend them to its own log — that way the sticky PR comment
    # and inline annotations cover render failures as well as verify
    # violations.
    - name: Render workers in working tree
      id: render
      shell: bash
      env:
        SKV_NO_UPDATE_CHECK: "1"
      run: |
        bin="${{ github.workspace }}/.skill-check/bin/iii-skill-render"
        preflight_log="${RUNNER_TEMP:-/tmp}/skv-preflight.log"
        : > "$preflight_log"
        shopt -s nullglob globstar 2>/dev/null || shopt -s nullglob

        fail=0
        for manifest in ${{ inputs.workers-glob }}; do
          dir="$(dirname "$manifest")"
          [ -d "$dir/docs" ] || continue

          # Capture stdout+stderr so we can echo it for visibility AND parse
          # it to synthesise a violations-format line on failure.
          if out=$("$bin" "$dir" --write 2>&1); then
            printf '%s\n' "$out"
          else
            rc=$?
            printf '%s\n' "$out"
            fail=1
            # iii-skill-render's anyhow chain looks like:
            #   Error: reading <path>
            #   Caused by:
            #       No such file or directory (os error 2)
            # Pull the path from the first line and emit one violation line
            # against it. Falls back to the worker dir if no path is in the
            # error message (e.g. a future failure mode we haven't covered).
            missing=$(printf '%s\n' "$out" | sed -nE 's/^Error: reading +(.+)$/\1/p' | head -1)
            if [ -n "$missing" ]; then
              printf '%s:1 — required source file is missing or unreadable; cannot render %s\n' \
                "$missing" "$dir" >> "$preflight_log"
            else
              first_line=$(printf '%s\n' "$out" | head -1 | sed -E 's/^Error: *//')
              printf '%s:1 — render failed: %s\n' "$dir" "${first_line:-unknown error}" >> "$preflight_log"
            fi
          fi
        done

        if [ -n "$(git status --porcelain)" ]; then
          echo "drift=present" >> "$GITHUB_OUTPUT"
          echo "rendered output drifted from sources; verify will run against the fresh artifacts."
        else
          echo "drift=none" >> "$GITHUB_OUTPUT"
        fi

        echo "preflight-log=$preflight_log" >> "$GITHUB_OUTPUT"
        echo "render-fail=$fail" >> "$GITHUB_OUTPUT"
        # Don't propagate render failures here — let verify run so the
        # sticky PR comment surfaces every issue at once. The verify step
        # below folds render-fail into its own exit code.
        exit 0

    - name: Install Vale
      shell: bash
      run: |
        v="${{ inputs.vale-version }}"
        case "$(uname -s)-$(uname -m)" in
          Linux-x86_64)              asset="vale_${v}_Linux_64-bit.tar.gz" ;;
          Linux-arm64|Linux-aarch64) asset="vale_${v}_Linux_arm64.tar.gz" ;;
          Darwin-arm64)              asset="vale_${v}_macOS_arm64.tar.gz" ;;
          Darwin-x86_64)             asset="vale_${v}_macOS_64-bit.tar.gz" ;;
          *) echo "unsupported runner: $(uname -s)-$(uname -m)" >&2; exit 1 ;;
        esac
        curl -sL "https://github.com/errata-ai/vale/releases/download/v${v}/${asset}" \
          | sudo tar -xz -C /usr/local/bin vale
        vale --version

    - name: Verify workers
      id: verify
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        INSTALL_DIR: ${{ github.workspace }}/.skill-check
        SKV_NO_UPDATE_CHECK: "1"
      run: |
        set -o pipefail
        log="${RUNNER_TEMP:-/tmp}/skv-verify.log"
        body="${RUNNER_TEMP:-/tmp}/skv-summary.md"
        rc=0

        # Seed the log with any render-step failures (missing docs/*.md,
        # etc.) so the sticky PR comment + inline annotations surface them
        # alongside verify violations.
        cp "${{ steps.render.outputs.preflight-log }}" "$log"

        "${{ github.action_path }}/scripts/verify.sh" \
          "${{ inputs.workers-glob }}" \
          "${{ inputs.layers }}" 2>&1 | tee -a "$log" || rc=$?

        # Inline annotations on the PR's "Files changed" tab. Free; no
        # consumer permission required.
        "${{ github.action_path }}/scripts/annotate.sh" "$log" || true

        # Render the markdown report once; reuse it for both the run-summary
        # surface and the optional sticky PR-comment so both say the same
        # thing (same closer line, same per-layer table).
        "${{ github.action_path }}/scripts/summary.sh" "$log" > "$body"
        cat "$body" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

        # Hand both paths to the optional PR-comment step.
        echo "log=$log" >> "$GITHUB_OUTPUT"
        echo "summary=$body" >> "$GITHUB_OUTPUT"

        # Fold render failures into our exit code so the workflow fails
        # whenever EITHER step found something — the report already covers
        # both kinds of finding.
        if [ "${{ steps.render.outputs.render-fail }}" = "1" ]; then
          rc=${rc:-0}
          [ "$rc" -eq 0 ] && rc=1
        fi
        exit $rc

    # Auto-fix push (write: true). Only runs on PRs, only when verify
    # passed, only when the in-tree render produced drift. The default
    # `if:` (`success()`) takes care of the verify-passed gate so the bot
    # never pushes content the action hasn't validated; that's the whole
    # point of moving this step *after* verify.
    - name: Commit and push rendered diff (write mode)
      if: ${{ inputs.write == 'true' && github.event_name == 'pull_request' && steps.render.outputs.drift == 'present' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A
        git commit -m "chore: auto-render worker docs"
        # GITHUB_HEAD_REF is the PR branch on the head repo. Push needs
        # contents: write, which the consumer's workflow grants explicitly
        # when opting into write mode.
        git push origin "HEAD:${GITHUB_HEAD_REF}"
        echo "committed rendered drift to ${GITHUB_HEAD_REF}"

    # Read-only mode: the in-tree render produced drift but the consumer
    # didn't opt into write mode, so we can't fix it for them. Surface the
    # drift as a workflow failure so they re-render locally and push.
    # Runs on `always()` so it still fires when verify itself failed —
    # consumers see both signals at once.
    - name: Fail on drift (read-only mode)
      if: ${{ always() && inputs.write != 'true' && steps.render.outputs.drift == 'present' }}
      shell: bash
      run: |
        echo "::error::rendered artifacts are out of date — run \`iii-skill-render <worker> --write\` locally and commit the result, or set \`write: true\` on the action to let CI commit it for you."
        exit 1

    # Sticky PR comment with the same markdown report. Requires the
    # consumer to grant `pull-requests: write` in their workflow's
    # `permissions:` block; without it, this step no-ops via
    # continue-on-error so it never causes a red CI run on its own.
    - name: Post sticky PR comment (opt-in via pull-requests:write)
      if: ${{ always() && github.event_name == 'pull_request' && steps.verify.outputs.summary != '' }}
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        "${{ github.action_path }}/scripts/pr-comment.sh" \
          "${{ github.event.pull_request.number }}" \
          "${{ steps.verify.outputs.summary }}"

name: skills-and-validation
description: Validate worker or docs skill artifacts via iii-skill-check
author: iii-hq

inputs:
  version:
    description: |
      Pinned validator release to download (e.g. "0.1.5", "0.1", or
      "latest"). Defaults to "latest" — track the most recent stable
      release. Pin via this input or via the `uses:`-line ref
      (`@v0.1.5`) when you want reproducibility.
    required: false
    default: "latest"
  config-path:
    description: |
      Path to the `.skill-check.yaml` that controls this run, relative to
      $GITHUB_WORKSPACE. Defaults to `.skill-check.yaml` at the workspace
      root. Set this when validating multiple modes in one repo via a
      matrix strategy — each matrix entry points at its own config and
      the sticky PR comment is keyed off the path so runs don't clobber
      each other.
    default: ".skill-check.yaml"
  workers-glob:
    description: |
      Worker mode: glob of worker manifests to verify, relative to
      $GITHUB_WORKSPACE. Ignored when the controlling `.skill-check.yaml`
      declares `mode: docs`.
    default: "*/iii.worker.yaml"
  docs-glob:
    description: |
      Docs mode: glob(s) of doc files to verify, relative to
      $GITHUB_WORKSPACE. Space-separated patterns are supported. Ignored
      when the controlling `.skill-check.yaml` declares `mode: worker`.
      The binary additionally filters per-file against
      `docs.include` / `docs.exclude` from the config, so a permissive
      glob can't make the renderer attempt non-doc files.
    default: "**/*.md **/*.mdx"
  layers:
    description: Comma-separated subset of layers to run (structure,vale,ai)
    default: "structure,vale,ai"
  vale-version:
    description: Pinned Vale version
    default: "3.14.1"
  anthropic-api-key:
    description: Anthropic API key for the AI layer (omit to skip AI)
    required: false
  write:
    description: |
      Auto-render and commit the rendered diff back to the PR branch when
      sources drift from rendered output. Worker mode commits per-worker
      README.md / skill.md / skills/; docs mode commits `<source>.skill.md`
      siblings only. Requires `contents: write`.
    default: "false"
  scope:
    description: |
      `all` (default) | `pr-diff`. Controls which artifacts get verified.
      With `pr-diff`, on `pull_request` events only files changed in the
      PR (against the merge base) are validated; in worker mode, a
      changed file under `<worker-dir>/` validates the whole worker.
      A diff that changes verdict-affecting `.skill-check.yaml` keys
      (rules, model, system_prompt, ai_check, mode) falls back to full
      scan; a change confined to `docs.include` / `docs.exclude` stays
      scoped. On `push` events `pr-diff` also falls back to full scan.
    default: "all"
  target-branch:
    description: |
      Branch to push the auto-render commit to when `write: true` and
      drift is present. Defaults to the empty string; the action then
      falls back to `$GITHUB_HEAD_REF` (set by the runner on
      `pull_request` events). Set this explicitly when invoking the
      action from `issue_comment` (e.g. the recheck-on-comment reusable
      workflow) — in that context `$GITHUB_HEAD_REF` is unset and the
      push would have no target.
    default: ""

runs:
  using: composite
  steps:
    - name: Resolve version
      id: ver
      shell: bash
      run: |
        v="${{ inputs.version }}"
        [ -z "$v" ] && v="latest"
        echo "version=$v" >> "$GITHUB_OUTPUT"

    - name: Download iii-skill-check release
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        "${{ github.action_path }}/scripts/ci-install.sh" \
          "${{ steps.ver.outputs.version }}" \
          "${{ runner.temp }}/skill-check"

    # Read mode from the config-path input. The binary itself also walks
    # up from each target to find the controlling config; the action
    # needs the mode here to decide which step body to run, so single
    # source of truth wins on the binary side and the action just
    # mirrors it.
    - name: Resolve mode
      id: mode
      shell: bash
      run: |
        config="${{ inputs.config-path }}"
        if [ ! -f "$config" ]; then
          echo "::error::config-path \`$config\` not found (relative to \$GITHUB_WORKSPACE)"
          exit 1
        fi
        mode=$(awk '/^mode:[[:space:]]*/ {sub(/^mode:[[:space:]]*/, ""); gsub(/[[:space:]]+|"/, ""); print; exit}' "$config")
        [ -z "$mode" ] && mode="worker"
        echo "mode=$mode" >> "$GITHUB_OUTPUT"
        echo "config=$config" >> "$GITHUB_OUTPUT"
        echo "resolved mode: $mode (from $config)"

    # Render every in-scope source into the working tree so verify
    # always operates on fresh artifacts. Mode determines what to
    # iterate: worker mode walks `workers-glob` and renders per worker
    # dir; docs mode walks `docs-glob` and renders per doc file. The
    # binary's per-target invocation is the same in both modes.
    #
    # Render failures are translated into a violations-format line and
    # written to a preflight log so verify can prepend them to its log;
    # the sticky PR comment + inline annotations cover render failures
    # alongside verify violations.
    - name: Render in working tree
      id: render
      shell: bash
      env:
        SKV_NO_UPDATE_CHECK: "1"
      run: |
        bin="${{ runner.temp }}/skill-check/bin/iii-skill-render"
        preflight_log="${RUNNER_TEMP:-/tmp}/skv-preflight.log"
        : > "$preflight_log"
        shopt -s nullglob globstar 2>/dev/null || shopt -s nullglob

        fail=0

        emit_violation() {
          local out="$1" label="$2"
          local missing
          missing=$(printf '%s\n' "$out" | sed -nE 's/^Error: reading +(.+)$/\1/p' | head -1)
          if [ -n "$missing" ]; then
            printf '%s:1 — required source file is missing or unreadable; cannot render %s\n' \
              "$missing" "$label" >> "$preflight_log"
          else
            local first_line
            first_line=$(printf '%s\n' "$out" | head -1 | sed -E 's/^Error: *//')
            printf '%s:1 — render failed: %s\n' "$label" "${first_line:-unknown error}" >> "$preflight_log"
          fi
        }

        if [ "${{ steps.mode.outputs.mode }}" = "docs" ]; then
          for doc in ${{ inputs.docs-glob }}; do
            case "$doc" in
              *.skill.md) continue ;;
            esac
            [ -f "$doc" ] || continue
            if out=$("$bin" "$doc" --write 2>&1); then
              printf '%s\n' "$out"
            else
              printf '%s\n' "$out"
              fail=1
              emit_violation "$out" "$doc"
            fi
          done
        else
          for manifest in ${{ inputs.workers-glob }}; do
            dir="$(dirname "$manifest")"
            # Skip workers that aren't using the renderer's partials
            # pattern. `docs/intro.md` is the minimum required partial; a
            # worker that ships only `docs/<other>.md` (skill bundles,
            # standalone notes) hand-authors its README instead.
            [ -f "$dir/docs/intro.md" ] || continue
            if out=$("$bin" "$dir" --write 2>&1); then
              printf '%s\n' "$out"
            else
              printf '%s\n' "$out"
              fail=1
              emit_violation "$out" "$dir"
            fi
          done
        fi

        # Drift detection scoped to rendered artifact paths so unrelated
        # untracked workspace files don't trigger an auto-commit. Mode
        # decides the path set: per-worker README/skill/skills/ vs
        # *.skill.md siblings.
        drift_paths=""
        if [ "${{ steps.mode.outputs.mode }}" = "docs" ]; then
          for doc in ${{ inputs.docs-glob }}; do
            case "$doc" in
              *.skill.md) continue ;;
            esac
            [ -f "$doc" ] || continue
            drift_paths+=" ${doc}.skill.md"
          done
        else
          for manifest in ${{ inputs.workers-glob }}; do
            dir="$(dirname "$manifest")"
            # Skip workers that aren't using the renderer's partials
            # pattern. `docs/intro.md` is the minimum required partial; a
            # worker that ships only `docs/<other>.md` (skill bundles,
            # standalone notes) hand-authors its README instead.
            [ -f "$dir/docs/intro.md" ] || continue
            drift_paths+=" $dir/README.md $dir/skill.md $dir/skills"
          done
        fi
        if [ -n "$drift_paths" ] \
           && [ -n "$(git status --porcelain -- $drift_paths 2>/dev/null)" ]; then
          echo "drift=present" >> "$GITHUB_OUTPUT"
          echo "rendered output drifted from sources; verify will run against the fresh artifacts."
        else
          echo "drift=none" >> "$GITHUB_OUTPUT"
        fi

        echo "preflight-log=$preflight_log" >> "$GITHUB_OUTPUT"
        echo "render-fail=$fail" >> "$GITHUB_OUTPUT"
        exit 0

    # Compute the PR-diff scope when `scope: pr-diff` and the event is a
    # pull request. The verify scripts filter their glob iteration by
    # intersection with the path list; an empty/unset path means full
    # scan. Bailout to full scan when the diff touches any
    # `.skill-check.yaml` or the workflow file itself — those changes
    # invalidate verdicts for unchanged files too, so skipping them
    # would let a regression slip through. `gh pr diff --name-only`
    # works under default `actions/checkout@v4` (no need for full
    # fetch-depth) and reports only the destination paths of renames.
    - name: Compute changed files (pr-diff scope)
      id: diff
      if: ${{ inputs.scope == 'pr-diff' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        out="${RUNNER_TEMP:-/tmp}/skv-changed-files"
        : > "$out"

        # ACMRT = added/copied/modified/renamed/typechanged. Deleted
        # files are excluded — they don't exist on disk so the verify
        # scripts' `[ -f "$doc" ] || continue` would skip them anyway,
        # but filtering here avoids them counting toward bailout logic.
        if ! gh pr diff "${{ github.event.pull_request.number }}" \
              --name-only > "$out" 2>/dev/null; then
          echo "::warning::could not compute PR diff; falling back to full scan"
          echo "changed-files=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        count=$(wc -l < "$out" | tr -d ' ')
        echo "PR diff: $count changed file(s)"

        # Bail to full scan when a .skill-check.yaml change affects
        # verdicts (rules, model, system_prompt, ai_check, mode) — those
        # can flip the verdict of files the PR never touched, so unchanged
        # docs must be re-checked. A change confined to docs.include /
        # docs.exclude is NOT a bailout: it only widens/narrows the file
        # set and can't change the verdict of a file that stays in scope.
        # (Bailing on an exclude-path tweak is what made unrelated,
        # pre-existing docs get flagged nondeterministically by the AI
        # layer.) Workflow-file edits are NOT a bailout either: the
        # workflow controls execution shape (which layers run, glob scope)
        # but not what the validator decides. config-verdict-changed.sh
        # makes the per-file call; the base version is fetched from the PR
        # base ref via the contents API (absent => new file => bails).
        bail=0
        config_changes="$(grep -E '(^|/)\.skill-check\.yaml$' "$out" || true)"
        if [ -n "$config_changes" ]; then
          base_sha="${{ github.event.pull_request.base.sha }}"
          while IFS= read -r cfg; do
            [ -n "$cfg" ] || continue
            base_tmp="$(mktemp)"
            # base64 decode via python so consumers on macOS runners (BSD
            # base64 uses `-D`, not `-d`) get the same behavior as Linux.
            if ! gh api "repos/${GITHUB_REPOSITORY}/contents/${cfg}?ref=${base_sha}" \
                  --jq '.content' 2>/dev/null \
                | python3 -c 'import base64,sys; sys.stdout.buffer.write(base64.b64decode(sys.stdin.buffer.read()))' \
                > "$base_tmp" 2>/dev/null; then
              : > "$base_tmp"   # absent at base (new config) => empty
            fi
            if "${{ github.action_path }}/scripts/config-verdict-changed.sh" "$base_tmp" "$cfg"; then
              echo "::notice::pr-diff bailout — verdict-affecting change in $cfg"
              bail=1
            else
              echo "$cfg changed only in docs.include/exclude — staying scoped"
            fi
            rm -f "$base_tmp"
          done <<< "$config_changes"
        fi

        if [ "$bail" -eq 1 ]; then
          echo "changed-files=" >> "$GITHUB_OUTPUT"
        else
          echo "pr-diff scope: filtering to $count file(s)"
          echo "changed-files=$out" >> "$GITHUB_OUTPUT"
        fi

    # Persistent skip-cache for the AI layer. Hash inputs are
    # (artifact, rules, system_prompt, model, doc_type); on a hit the
    # binary skips the Anthropic call entirely. A rules edit busts every
    # affected entry automatically because the rules contribute to the
    # hash, so there is no manual invalidation step. Only PASSes are
    # recorded — a FAIL re-runs on the next push.
    #
    # restore-keys fall through to the most recent cache for this
    # config-path, then any cache for the repo. The save key includes
    # run_id + run_attempt so saves never collide; the post-step always
    # writes under a fresh key so the cache rolls forward each run.
    - name: Restore AI pass cache
      id: ai-cache-restore
      if: ${{ contains(inputs.layers, 'ai') }}
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/skv-ai-pass-cache
        key: skv-ai-pass-cache-v1-${{ inputs.config-path }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          skv-ai-pass-cache-v1-${{ inputs.config-path }}-
          skv-ai-pass-cache-v1-

    - name: Install Vale
      shell: bash
      run: |
        v="${{ inputs.vale-version }}"
        case "$(uname -s)-$(uname -m)" in
          Linux-x86_64)              asset="vale_${v}_Linux_64-bit.tar.gz" ;;
          Linux-arm64|Linux-aarch64) asset="vale_${v}_Linux_arm64.tar.gz" ;;
          Darwin-arm64)              asset="vale_${v}_macOS_arm64.tar.gz" ;;
          Darwin-x86_64)             asset="vale_${v}_macOS_64-bit.tar.gz" ;;
          *) echo "unsupported runner: $(uname -s)-$(uname -m)" >&2; exit 1 ;;
        esac
        curl -sL "https://github.com/errata-ai/vale/releases/download/v${v}/${asset}" \
          | sudo tar -xz -C /usr/local/bin vale
        vale --version

    - name: Verify
      id: verify
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        INSTALL_DIR: ${{ runner.temp }}/skill-check
        SKV_NO_UPDATE_CHECK: "1"
        # iii-skill-check reads this env var to enable the persistent
        # AI skip-cache. Unset = no caching (direct CLI behavior).
        SKV_AI_CACHE: ${{ runner.temp }}/skv-ai-pass-cache
        # verify-*.sh reads this env var to scope its glob iteration to
        # files in the PR diff. Empty = full scan (scope=all, or
        # pr-diff bailout via .skill-check.yaml / workflow edits).
        SKV_CHANGED_FILES: ${{ steps.diff.outputs.changed-files }}
      run: |
        set -o pipefail
        log="${RUNNER_TEMP:-/tmp}/skv-verify.log"
        body="${RUNNER_TEMP:-/tmp}/skv-summary.md"
        rc=0

        cp "${{ steps.render.outputs.preflight-log }}" "$log"

        if [ "${{ steps.mode.outputs.mode }}" = "docs" ]; then
          script="verify-docs.sh"
          glob="${{ inputs.docs-glob }}"
        else
          script="verify-workers.sh"
          glob="${{ inputs.workers-glob }}"
        fi
        "${{ github.action_path }}/scripts/$script" \
          "$glob" \
          "${{ inputs.layers }}" 2>&1 | tee -a "$log" || rc=$?

        "${{ github.action_path }}/scripts/annotate.sh" "$log" || true
        "${{ github.action_path }}/scripts/summary.sh" \
          "$log" \
          "${{ steps.mode.outputs.mode }}" \
          "${{ steps.render.outputs.drift }}" \
          > "$body"
        cat "$body" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

        echo "log=$log" >> "$GITHUB_OUTPUT"
        echo "summary=$body" >> "$GITHUB_OUTPUT"

        if [ "${{ steps.render.outputs.render-fail }}" = "1" ]; then
          rc=${rc:-0}
          [ "$rc" -eq 0 ] && rc=1
        fi
        exit $rc

    # Save unconditionally — `if: always()` ensures PASSes recorded mid-run
    # survive a verify FAIL. The cache file only grows with PASS entries,
    # so saving on FAIL is safe: failing artifacts didn't write to it.
    - name: Save AI pass cache
      if: ${{ always() && contains(inputs.layers, 'ai') && steps.ai-cache-restore.outcome == 'success' }}
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/skv-ai-pass-cache
        key: skv-ai-pass-cache-v1-${{ inputs.config-path }}-${{ github.run_id }}-${{ github.run_attempt }}

    # `success() &&` is required because an explicit `if:` overrides the
    # default `success()` gate. Without it the auto-commit step would
    # run on verify failures too, pushing un-validated bot commits to
    # the PR branch — which moves the PR head off the SHA the check
    # runs are anchored to and breaks the failing-status display.
    #
    # The step accepts both `pull_request` (default GITHUB_HEAD_REF) and
    # `issue_comment` (target-branch input passed by the recheck-on-
    # comment listener) so a checkbox-triggered re-render actually
    # commits. The push target is resolved at runtime; if neither is
    # set, the step emits `committed=failure` and exits 1.
    #
    # The `committed` output is the canonical signal for downstream
    # steps and for augment-summary-drift.sh: `success` | `noop` |
    # `failure`. The default GitHub `steps.commit.outcome` alone
    # conflates "step skipped because verify failed" (the right user-
    # facing message is "skipped, fix verify first") with "step ran but
    # found nothing to commit" (the right message is "noop") and with
    # the actual happy path.
    - name: Commit and push rendered diff (write mode)
      id: commit
      if: ${{ success() && inputs.write == 'true' && steps.render.outputs.drift == 'present' && (github.event_name == 'pull_request' || github.event_name == 'issue_comment') }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        target="${{ inputs.target-branch }}"
        target="${target:-${GITHUB_HEAD_REF:-}}"
        if [ -z "$target" ]; then
          echo "::error::no target branch for auto-render push — pass \`target-branch\` input or run on a pull_request event"
          echo "committed=failure" >> "$GITHUB_OUTPUT"
          exit 1
        fi

        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        shopt -s nullglob globstar 2>/dev/null || shopt -s nullglob
        if [ "${{ steps.mode.outputs.mode }}" = "docs" ]; then
          for doc in ${{ inputs.docs-glob }}; do
            case "$doc" in
              *.skill.md) continue ;;
            esac
            [ -f "$doc" ] || continue
            git add "${doc}.skill.md" 2>/dev/null || true
          done
        else
          for manifest in ${{ inputs.workers-glob }}; do
            dir="$(dirname "$manifest")"
            # Skip workers that aren't using the renderer's partials
            # pattern. `docs/intro.md` is the minimum required partial; a
            # worker that ships only `docs/<other>.md` (skill bundles,
            # standalone notes) hand-authors its README instead.
            [ -f "$dir/docs/intro.md" ] || continue
            git add "$dir/README.md" "$dir/skill.md" 2>/dev/null || true
            git add -A "$dir/skills/" 2>/dev/null || true
          done
        fi

        if git diff --cached --quiet; then
          echo "no rendered artifacts to commit (drift was outside the scoped add-set)"
          echo "committed=noop" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        git commit -m "chore: auto-render skill artifacts"

        # Retry-with-rebase on push. Matrix-strategy consumers run the
        # action in parallel jobs (e.g. workers + docs modes); both
        # jobs may auto-commit a rendered diff and race on push. Each
        # matrix run touches a disjoint path set (workers: README /
        # skill.md / skills/; docs: *.skill.md siblings), so rebasing
        # this commit onto whatever the other job pushed is normally
        # conflict-free. If the rebase does conflict — overlapping
        # paths between matrix runs — abort and surface a warning
        # rather than paper over a real merge issue.
        for attempt in 1 2 3 4 5; do
          if git push origin "HEAD:${target}"; then
            [ "$attempt" -gt 1 ] && \
              echo "auto-render push succeeded on attempt $attempt"
            echo "committed rendered drift to ${target}"
            echo "committed=success" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::notice::auto-render push rejected (attempt $attempt); fetching + rebasing"
          git fetch --quiet origin "${target}" || true
          if ! git rebase --quiet "origin/${target}"; then
            git rebase --abort 2>/dev/null || true
            echo "::warning::auto-render rebase conflicted with origin/${target}; re-render locally and push."
            echo "committed=failure" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          sleep "$attempt"
        done
        echo "::warning::auto-render push failed after 5 attempts"
        echo "committed=failure" >> "$GITHUB_OUTPUT"
        exit 1

    # Surface drift in the sticky PR comment. The verify step builds the
    # summary from in-scope artifacts only; drift in unchanged artifacts
    # (caught by render's global drift check) was previously invisible to
    # the comment, so a "0 verified, 0 skipped" run with drift posted a
    # "three for three" success message while the job itself went red.
    # Augment the summary file in place before the comment step reads it.
    #
    # COMMIT_STATUS is the explicit signal from the commit step:
    # `success` (committed + pushed), `noop` (nothing to commit), or
    # `failure` (push failed after retries). Empty when the commit step
    # was skipped (write: false, or verify failed first).
    - name: Augment summary with drift status
      if: ${{ always() && steps.render.outputs.drift == 'present' && steps.verify.outputs.summary != '' && (github.event_name == 'pull_request' || github.event_name == 'issue_comment') }}
      shell: bash
      env:
        BODY: ${{ steps.verify.outputs.summary }}
        WRITE_MODE: ${{ inputs.write }}
        COMMIT_STATUS: ${{ steps.commit.outputs.committed }}
        PR_IS_FORK: ${{ github.event.pull_request.head.repo.fork || 'false' }}
      run: |
        "${{ github.action_path }}/scripts/augment-summary-drift.sh" \
          "$BODY" "$WRITE_MODE" "$COMMIT_STATUS" "$PR_IS_FORK"

    - name: Fail on drift (read-only mode)
      if: ${{ always() && inputs.write != 'true' && steps.render.outputs.drift == 'present' }}
      shell: bash
      run: |
        echo "::error::rendered artifacts are out of date — re-render locally (\`iii-skill-render <target> --write\`) and commit, or set \`write: true\` on the action to let CI commit it for you."
        exit 1

    - name: Post sticky PR comment (opt-in via pull-requests:write)
      if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'issue_comment') && steps.verify.outputs.summary != '' }}
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # PR number sits in different places depending on the event:
        # `pull_request.number` for the main check, `issue.number` for
        # the issue_comment-driven recheck (the issue *is* the PR).
        "${{ github.action_path }}/scripts/pr-comment.sh" \
          "${{ github.event.pull_request.number || github.event.issue.number }}" \
          "${{ steps.verify.outputs.summary }}" \
          "${{ inputs.config-path }}"
